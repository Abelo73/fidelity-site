<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="100%" height="100%">
  <defs>
    <linearGradient id="architects-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="shadow-red" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#991B1B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g transform="translate(40, 40)" filter="url(#shadow-red)">
    <!-- Stylized Red 'F' Architectural Wing -->
    <path d="M40,190 L40,60 L130,20 L130,55 L75,80 L120,110 L120,140 L75,110 L75,190 Z" fill="url(#architects-red)" />

    <!-- Architectural High-Rise Skyscrapers Silhouettes -->
    <!-- Tower 1 -->
    <rect x="145" y="100" width="24" height="90" fill="#991B1B" />
    <polygon points="145,100 157,80 169,100" fill="#DC2626" />
    <!-- Tower 2 (Tall Main Tower) -->
    <rect x="175" y="40" width="36" height="150" fill="url(#architects-red)" />
    <polygon points="175,40 193,10 211,40" fill="#EF4444" />
    <line x1="193" y1="10" x2="193" y2="-5" stroke="#B91C1C" stroke-width="3" />
    <!-- Tower Windows -->
    <g fill="#FFFFFF" opacity="0.8">
      <rect x="183" y="55" width="6" height="12" />
      <rect x="195" y="55" width="6" height="12" />
      <rect x="183" y="75" width="6" height="12" />
      <rect x="195" y="75" width="6" height="12" />
      <rect x="183" y="95" width="6" height="12" />
      <rect x="195" y="95" width="6" height="12" />
      <rect x="183" y="115" width="6" height="12" />
      <rect x="195" y="115" width="6" height="12" />
      <rect x="183" y="135" width="6" height="12" />
      <rect x="195" y="135" width="6" height="12" />
    </g>
    <!-- Tower 3 -->
    <rect x="217" y="80" width="28" height="110" fill="#B91C1C" />
    <polygon points="217,80 231,60 245,80" fill="#DC2626" />
    
    <!-- Base Red Bar -->
    <rect x="35" y="193" width="750" height="6" fill="url(#architects-red)" rx="3" />

    <!-- Text Group -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <text x="270" y="105" font-size="34" font-weight="900" letter-spacing="1.5" fill="#7F1D1D">FIDELITY ARCHITECTS &amp;</text>
      <text x="270" y="145" font-size="34" font-weight="900" letter-spacing="1.5" fill="#7F1D1D">CONSULTING ENGINEERS</text>
      <text x="470" y="235" font-size="24" font-style="italic" font-weight="600" fill="#991B1B">Building a legacy!</text>
    </g>
  </g>
</svg>
